<script type="text/plain" id="analyse-py">"""
Auswertung der Beschleunigungsdaten (ohne GUI- oder Bluetooth-Abhängigkeiten).

Eingabe: Liste von Samples (t, ax, ay, az, az_welt, gx, gy, gz) mit Beschleunigung in g
und Drehrate in °/s. Ausgabe: ein Ergebnis-Objekt mit Kurven und Kennwerten je Wiederholung.
"""
from __future__ import annotations

import logging
from dataclasses import dataclass, field

import numpy as np

try:
    from scipy.signal import butter, filtfilt
    HAS_SCIPY = True
except ImportError:  # Fallback: Gleitmittelwert
    HAS_SCIPY = False

log = logging.getLogger(__name__)

G = 9.81

# Wiederholungserkennung
V_MIN_REP = 0.15          # m/s, Mindest-Aufwärtsgeschwindigkeit
V_RAND = 0.01             # m/s, Rand der Wiederholung (Geschwindigkeit ~ 0)
MIN_HUB_ANTEIL = 0.5      # Wdh. mit weniger als 50 % des größten Hubs werden verworfen
MAX_START_ABW = 0.7       # max. Abweichung der Starthöhe (Anteil des größten Hubs)
MIN_REP_DAUER = 0.2       # s
MERGE_LUECKE = 0.1        # s, Wdh. mit kleinerer Lücke werden verschmolzen
BASIS_FENSTER_S = 4.0  # s: Fenster für den langsamen Geschwindigkeits-Versatz bei der Erkennung
BASIS_TOTZONE = 0.10   # m/s: kleinere Versätze werden nicht herausgerechnet
ANKER_SCHWELLEN = (V_MIN_REP, 0.10, 0.10)  # Kandidaten fürs Verankern: zweite Stufe empfindlicher
VOLLER_HUB_ANTEIL = 0.8  # Kandidaten mit mindestens diesem Hub-Anteil entfallen von der Starthöhen-Prüfung
MAX_ZYKLUS_S = 6.0     # s: Zyklen (Start bis nächster Start) bis zu dieser Länge werden geschlossen
VORLAUF_MAX_S = 1.0     # s: längerer Vorlauf vor der Spitze gilt nicht mehr als Teil des Stoßes
VORLAUF_ANTEIL = 0.05   # Anteil der Spitzengeschwindigkeit, ab dem der Stoß beginnt
PLATEAU_ANTEIL = 0.20   # Anteil der Spitzengeschwindigkeit: darunter gilt v vor dem Stoß als flaches Plateau
PLATEAU_MIN_S = 0.30    # s: so lange muss das Plateau mindestens dauern, damit es vom Fenster abgeschnitten wird
STEIGUNG_MIN = 0.05     # 1/s: Mindeststeigung von v am Stoßanfang, Anteil der Spitzengeschwindigkeit pro Sekunde
LETZTE_MIN_ZYKLEN = 2  # so viele frühere Zyklen braucht die Schätzung für die letzte Wiederholung
SENK_V = 0.3           # m/s: Geschwindigkeit, ab der ein Stoß bzw. Senken gezählt wird
DRIFT_MIN = 0.05          # m, kleinste Nettoverschiebung je Zyklus, die als gleichmäßige Drift gilt
DRIFT_KONSISTENT = 0.25   # Streuung der Zyklus-Nettoverschiebungen höchstens so groß (Anteil), sonst keine gleichmäßige Drift
LETZTE_TOL = 0.5       # Anteil des Hubs: so weit darf die Nettoverschiebung des letzten Zyklus von den früheren abweichen
RAND_TOL = 0.003      # m/s: Toleranz beim Verlängern der Fensterränder (Rauschen)
MIN_FENSTER_SAMPLES = 5   # kleinste erlaubte Fensterbreite
V_MIN_KAND = 0.10         # m/s, untere Schwelle der endgültigen Kandidatensuche (Fensterränder, langsame Wdh. mit Plateau)
V_HOCH_KAND = 0.15        # m/s, so schnell muss v im Fenster mindestens einmal sein
START_NACHBARN = 3        # Starthöhe wird mit so vielen Wdh. links/rechts verglichen (nicht mit der besten)
V_MIN_BEREICH = (V_MIN_REP, 0.08, 0.04)   # immer empfindlichere Schwellen für den markierten Bereich

# Gyro-Filter
GATE = 0.15
KP_GYRO = 1.0

# Qualitätsprüfungen
SAT_G = 15.8              # Sensorbereich ±16 g
RATE_TOL = 0.05           # 5 % Abweichung der Abtastrate
RUHE_STD_MAX = 0.5        # m/s², max. Rauschen in den ersten 0,5 s
RATE_STUFEN = (10, 20, 50, 100, 200)

# Spalten im Sample-Array
COL_T = 0
ACC = slice(1, 4)
COL_AZ = 3
COL_AZ_WELT = 4
GYR = slice(5, 8)


@dataclass
class Rep:
    nr: int
    s: int                      # Startindex
    e: int                      # Endindex (exklusiv)
    t_start: float = 0.0
    dauer: float = 0.0
    hub: float = 0.0
    a_max: float = 0.0
    v_max: float = 0.0
    v_mean: float = 0.0
    F_max: float = 0.0
    F_mean: float = 0.0
    P_max: float = 0.0
    P_mean: float = 0.0
    dv: float = 0.0             # Abfall ggü. bester Wdh. in %
    dF: float = 0.0
    dP: float = 0.0


@dataclass
class Ergebnis:
    t: np.ndarray
    weg: np.ndarray
    v: np.ndarray
    a: np.ndarray
    F: np.ndarray
    P: np.ndarray
    dt: float
    hz: int
    drift: float
    hub: np.ndarray = None
    reps: list = field(default_factory=list)
    warnungen: list = field(default_factory=list)

    def setze_reps(self, grenzen):
        """Setzt die Wiederholungsfenster (Sample-Indizes) und berechnet alle Kennwerte neu."""
        n = len(self.t)
        gr = sorted((max(0, int(s)), min(n, int(e))) for s, e in grenzen)
        bereinigt, letztes_ende = [], 0
        for s, e in gr:
            s = max(s, letztes_ende)           # keine Überlappung
            if e - s >= 2:
                bereinigt.append((s, e))
                letztes_ende = e
        reps = []
        for k, (s, e) in enumerate(bereinigt, 1):
            sl = slice(s, e)
            reps.append(Rep(
                nr=k, s=s, e=e, t_start=float(self.t[s]), dauer=(e - s) * self.dt,
                hub=float(self.weg[sl].max() - self.weg[s]),
                a_max=float(self.a[sl].max()), v_max=float(self.v[sl].max()),
                v_mean=float(self.v[sl].mean()),
                F_max=float(self.F[sl].max()), F_mean=float(self.F[sl].mean()),
                P_max=float(self.P[sl].max()), P_mean=float(self.P[sl].mean())))
        if reps:
            beste = {k: max(getattr(r, k) for r in reps) for k in ("P_max", "F_max", "v_max")}
            for r in reps:
                r.dP = (1 - r.P_max / beste["P_max"]) * 100 if beste["P_max"] > 0 else 0.0
                r.dF = (1 - r.F_max / beste["F_max"]) * 100 if beste["F_max"] > 0 else 0.0
                r.dv = (1 - r.v_max / beste["v_max"]) * 100 if beste["v_max"] > 0 else 0.0
        self.reps = reps
        self.hub = hub_kurve(self.weg, reps)

    def erkenne_im_bereich(self, t0, t1):
        """
        Wiederholungen, deren Geschwindigkeitsspitze im Bereich [t0, t1] (Sekunden) liegt, als Liste (s, e).
        Der Nutzer sagt hier, dass dort Wiederholungen sind. Deshalb wird die Schwelle schrittweise
        empfindlicher, bis etwas gefunden wird.
        """
        n = len(self.t)
        i0, i1 = max(0, int(round(t0 / self.dt))), min(n, int(round(t1 / self.dt)))
        for v_min in V_MIN_BEREICH:
            segs = [(s, e) for s, e in finde_wiederholungen(self.v, self.dt, v_min)
                    if i0 <= s + int(np.argmax(self.v[s:e])) < i1]
            if segs:
                hubs = [float(self.weg[s:e].max() - self.weg[s]) for s, e in segs]
                grenze = MIN_HUB_ANTEIL * max(hubs)
                return [sg for sg, h in zip(segs, hubs) if h >= grenze]
        return []

    def fenster_sekunden(self):
        return [(r.s * self.dt, r.e * self.dt) for r in self.reps]


def integrieren(a, dt):
    return np.concatenate(([0.0], np.cumsum((a[1:] + a[:-1]) / 2 * dt)))


def rekonstruiere_zeit(t_ankunft):
    """Gleichmäßige Zeitachse per linearem Fit (BLE-Pakete kommen gebündelt an)."""
    t = np.asarray(t_ankunft, dtype=float)
    n = len(t)
    if n < 10:
        return t - t[0]
    k = np.arange(n)
    steigung, achsenabschnitt = np.polyfit(k, t - t[0], 1)
    t_neu = steigung * k + achsenabschnitt
    return t_neu - t_neu[0]


def tiefpass(daten, fs, grenzfreq):
    """Nullphasiger Tiefpass. Butterworth (scipy) oder Gleitmittelwert als Fallback."""
    daten = np.asarray(daten, dtype=float)
    if not grenzfreq or grenzfreq <= 0 or len(daten) < 15 or grenzfreq >= 0.45 * fs:
        return daten
    if HAS_SCIPY:
        b, a = butter(2, grenzfreq / (fs / 2))   # filtfilt verdoppelt die Ordnung
        return filtfilt(b, a, daten)
    k = int(round(0.443 * fs / grenzfreq))        # -3-dB-Frequenz des Gleitmittels
    if k % 2 == 0:
        k += 1
    if k <= 1 or len(daten) < k:
        return daten
    pad = k // 2
    return np.convolve(np.pad(daten, (pad, pad), mode="edge"), np.ones(k) / k, mode="valid")


def finde_wiederholungen(v, dt, v_min=V_MIN_REP, v_hoch=None):
    """Fenster, in denen v über v_min liegt und mindestens einmal v_hoch erreicht (Standard: v_hoch = v_min)."""
    n = len(v)
    aktiv = v > v_min
    segs, start = [], None
    for i in range(n):
        if aktiv[i] and start is None:
            start = i
        elif not aktiv[i] and start is not None:
            segs.append([start, i])
            start = None
    if start is not None:
        segs.append([start, n])

    if v_hoch is not None and v_hoch > v_min:
        segs = [sg for sg in segs if np.max(v[sg[0]:sg[1]]) > v_hoch]
    merged = []
    for s in segs:
        if merged and (s[0] - merged[-1][1]) * dt < MERGE_LUECKE:
            merged[-1][1] = s[1]
        else:
            merged.append(s)

    out = []
    for s, e in merged:
        if (e - s) * dt < MIN_REP_DAUER:
            continue
        # Langer, schwacher Vorlauf (Rest-Drift nach einem kleinen Stoß, Gehen, Hängen): die Wiederholung beginnt
        # erst dort, wo der eigentliche Stoß anfängt. Dort ist v wirklich ~0 und der richtige Ankerpunkt.
        pk = s + int(np.argmax(v[s:e]))
        # Langsames Plateau vor dem eigentlichen Stoß (v lange nur ~20 % der Spitze, z. B. Versatz nach dem Absetzen):
        # Das Fenster beginnt erst dort, wo die Geschwindigkeit wirklich ansteigt.
        flach = np.nonzero(v[s:pk] < PLATEAU_ANTEIL * v[pk])[0]
        if len(flach) and flach[-1] * dt > PLATEAU_MIN_S:
            s = s + int(flach[-1])
        if (pk - s) * dt > VORLAUF_MAX_S:
            tief = np.nonzero(v[s:pk] < max(V_RAND, VORLAUF_ANTEIL * v[pk]))[0]
            s = s + int(tief[-1]) if len(tief) else pk - int(0.3 / dt)
        # Rand nur so weit verlängern, wie v noch fällt. Bleibt nach dem Stoß eine Rest-Geschwindigkeit
        # (Drift) stehen, endet die Wiederholung am Ende des Abfalls und nicht erst bei v = 0.
        # Am Anfang nur dort, wo v wirklich ansteigt: eine flache Stelle (konstanter Versatz) gehört nicht dazu.
        vp = float(np.max(v[s:e]))
        steigung_min = STEIGUNG_MIN * vp * dt
        while s > 0 and V_RAND < v[s - 1] <= v[s] + RAND_TOL and v[s] - v[s - 1] > steigung_min:
            s -= 1
        while e < n and V_RAND < v[e] <= v[e - 1] + RAND_TOL:
            e += 1
        if out and s <= out[-1][1]:
            out[-1] = (out[-1][0], max(e, out[-1][1]))
        else:
            out.append((s, e))
    return out


def langsamer_versatz(v, dt):
    """Langsam veränderlicher Geschwindigkeits-Versatz (Drift bei gekipptem Sensor). Gleitender Median über
    mehrere Sekunden, kleine Werte (Totzone) werden ignoriert, damit normale Messungen unverändert bleiben.
    Reines numpy (ohne scipy): der Median wird auf einem groben Raster berechnet, der Versatz ist ja langsam."""
    n = len(v)
    schritt = max(1, int(0.1 / dt))
    k = max(3, int(BASIS_FENSTER_S / dt / schritt) | 1)
    vg = v[::schritt]
    if len(vg) < k:
        return np.zeros_like(v)
    pad = k // 2
    vp = np.concatenate((np.full(pad, vg[0]), vg, np.full(pad, vg[-1])))
    fenster = np.lib.stride_tricks.sliding_window_view(vp, k)
    b = np.empty(len(vg))
    for i in range(0, len(vg), 2000):                 # in Stücken, spart Speicher bei langen Messungen
        b[i:i + 2000] = np.median(fenster[i:i + 2000], axis=1)
    b = np.interp(np.arange(n), np.arange(len(vg)) * schritt, b)
    return np.sign(b) * np.maximum(np.abs(b) - BASIS_TOTZONE, 0.0)


def erkenne(v, dt, v_min=V_MIN_REP, v_hoch=None):
    """Wiederholungen suchen, nachdem ein großer langsamer Versatz von v abgezogen wurde."""
    return finde_wiederholungen(v - langsamer_versatz(v, dt), dt, v_min, v_hoch)


def verwerfe_stoerungen(v, segs, dt):
    if len(segs) < 2:
        return segs
    weg = integrieren(v, dt)
    hubs = np.array([weg[s:e].max() - weg[s] for s, e in segs])
    starts = np.array([weg[s] for s, _ in segs])
    # Zweites Maß: Hübe nach Zyklus-Schließung. Bei starker Drift sind die rohen Hübe um Dezimeter verfälscht und
    # normale Wiederholungen wirken "zu klein". Eine Wiederholung bleibt, wenn sie nach einem der beiden Maße groß
    # genug ist (roh: Doppelstöße; korrigiert: Drift).
    weg_k = integrieren(zyklen_schliessen(v, [s for s, _ in segs], dt), dt)
    hubs_k = np.array([weg_k[s:e].max() - weg_k[s] for s, e in segs])
    # Referenz = Median der oberen Hälfte: ein einzelner durch Drift riesiger Hub (Meter) darf nicht
    # alle normalen Wiederholungen als "zu klein" aussortieren.
    h_ref = float(np.median(np.sort(hubs)[len(hubs) // 2:]))
    h_ref_k = float(np.median(np.sort(hubs_k)[len(hubs_k) // 2:]))
    ref = int(np.argmin(np.abs(hubs - h_ref)))
    grenze = MAX_START_ABW * h_ref
    hub_ok = (hubs >= MIN_HUB_ANTEIL * h_ref) | (hubs_k >= MIN_HUB_ANTEIL * h_ref_k)
    # Die integrierte Position driftet bei langen Sätzen um Meter weg. Deshalb wird die Starthöhe nur
    # mit den Nachbar-Wiederholungen verglichen, nicht mit der besten des ganzen Satzes.
    n = len(segs)
    start_ok = np.ones(n, dtype=bool)
    ts = np.array([s for s, _ in segs], dtype=float)
    # Bei Drift verschiebt sich die Starthöhe von Wiederholung zu Wiederholung gleichmäßig (z. B. 0,25 m je Wdh.).
    # Deshalb wird sie zwischen dem nächsten gültigen Nachbarn davor und danach linear interpoliert, nicht
    # mit dem Median verglichen. Gibt es nur auf einer Seite Nachbarn, zählt deren Median.
    for k in range(n):
        links = [j for j in range(k - 1, -1, -1) if hub_ok[j]][:START_NACHBARN]      # die nächsten gültigen Nachbarn,
        rechts = [j for j in range(k + 1, n) if hub_ok[j]][:START_NACHBARN]          # winzige Kandidaten dazwischen zählen nicht
        if links and rechts and (ts[rechts[0]] - ts[links[0]]) * dt <= 2 * MAX_ZYKLUS_S:
            a, b = links[0], rechts[0]
            erwartet = starts[a] + (starts[b] - starts[a]) * (ts[k] - ts[a]) / (ts[b] - ts[a])
            abw = abs(starts[k] - erwartet)
            abw = min(abw, abs(starts[k] - np.median(starts[links + rechts])))   # wie bisher, falls das besser passt
            start_ok[k] = abw <= grenze
        elif links or rechts:
            nachbarn = links + rechts
            start_ok[k] = abs(starts[k] - np.median(starts[nachbarn])) <= grenze
    # Bei gekipptem Sensor driftet die Starthöhe um Meter. Kandidaten mit vollem Hub sind trotzdem echte
    # Wiederholungen; die Starthöhe prüft nur kleinere Kandidaten (typische Störungen).
    start_ok |= hubs >= VOLLER_HUB_ANTEIL * h_ref
    start_ok[ref] = True
    keep = hub_ok & start_ok
    return [sg for sg, k in zip(segs, keep) if k]


def _trapez(y, dx):
    return float(np.sum((y[1:] + y[:-1]) / 2) * dx)


def _ende_der_senkphase(v, s, dt):
    """Index (relativ zu s), an dem nach Stoß und Senken die Hantel wieder zur Ruhe kommt, oder None, wenn
    nach dem Stoß nicht gesenkt wurde (Stange bleibt oben) oder der Zyklus zu lang ist."""
    n = min(len(v) - s, int(MAX_ZYKLUS_S / dt))
    seg = v[s:s + n]
    hoch = np.nonzero(seg > SENK_V)[0]
    if len(hoch) == 0:
        return None
    runter = np.nonzero(seg[hoch[0]:] < -SENK_V)[0]
    if len(runter) == 0:
        return None
    i = hoch[0] + runter[0]
    ruhe = np.nonzero(seg[i:] > -0.05)[0]
    if len(ruhe) == 0:
        return None
    j = int(i + ruhe[0])
    return j if j > 10 else None


def zyklen_schliessen(v, starts, dt, ende=None):
    """
    Zwischen zwei aufeinanderfolgenden Wiederholungen kommt die Stange wieder auf die Startposition zurück
    (Brust, Boden). Die Nettoverschiebung eines Zyklus ist also null. Bleibt in v ein Rest (Drift, Sensorkippen),
    wird er als Parabel mit Nullstellen an beiden Zyklusenden abgezogen. Das hält den Hub bei langen Sätzen
    ohne Pause stabil. Nur für kurze Zyklen, die Starts selbst bleiben unverändert.

    Die letzte Wiederholung hat keinen Folge-Start. Ist `ende` (Index des Satzendes) gegeben und kam die Stange
    danach so zurück wie nach den vorherigen (Nettoverschiebung bis zum Satzende passt zu den früheren Zyklen),
    bekommt sie dieselbe Korrektur wie diese. Bleibt die Stange oben (z. B. Ende einer Bankdrück-Serie),
    bleibt sie unverändert.
    """
    v = v.copy()
    w = integrieren(v, dt)
    st = sorted(starts)
    laengen, netto = [], []
    for s, e in zip(st[:-1], st[1:]):
        T = (e - s) * dt
        if T > MAX_ZYKLUS_S or e - s < 10:
            continue
        laengen.append(T)
        netto.append(float(w[e] - w[s]))
        tau = np.arange(e - s + 1) * dt
        p = tau * (T - tau)
        k = _trapez(v[s:e + 1], dt) / _trapez(p, dt)
        v[s:e + 1] -= k * p
    if ende is not None and len(laengen) >= LETZTE_MIN_ZYKLEN:
        s = st[-1]
        j = _ende_der_senkphase(v, s, dt)          # None: nach dem Stoß wurde nicht gesenkt
        T = float(np.median(laengen))
        e = s + int(round(T / dt))
        i_vor = float(np.median(netto))
        if j is not None and e < len(v) and e > s + 10:
            hub = float(w[s:s + j + 1].max() - w[s])
            net = float(w[s + j] - w[s])
            if hub > 0 and abs(net - i_vor) < LETZTE_TOL * hub:
                if abs(i_vor) >= DRIFT_MIN and float(np.std(netto)) <= DRIFT_KONSISTENT * abs(i_vor):
                    # Die früheren Zyklen driften gleichmäßig (Sensorneigung): die letzte driftet genauso.
                    tau = np.arange(e - s + 1) * dt
                    v[s:e + 1] -= (i_vor * 6 / T ** 3) * tau * (T - tau)
                else:
                    # Keine gleichmäßige Drift in den früheren Zyklen: die Stange kam nach dem Senken zurück auf die
                    # Startposition, der Rest ist ein Messfehler dieser Wiederholung und wird wie bei den anderen abgezogen.
                    Tj = j * dt
                    tau = np.arange(j + 1) * dt
                    p = tau * (Tj - tau)
                    v[s:s + j + 1] -= _trapez(v[s:s + j + 1], dt) / _trapez(p, dt) * p
    return v


def hub_kurve(weg, reps):
    """Hub relativ zum Start der jeweils letzten Wiederholung."""
    if reps:
        starts = [r.s for r in reps]
        return weg - np.interp(np.arange(len(weg)), starts, weg[starts])
    return weg - weg[0]


def vertikal_mit_gyro(arr):
    """Vertikale Beschleunigung (g) mit Mahony-Filter inkl. Gate gegen Fremdbeschleunigung."""
    t = arr[:, COL_T]
    acc = arr[:, ACC]
    n0 = max(3, int(np.searchsorted(t, t[0] + 0.5)))
    gyr = np.radians(arr[:, GYR]) - np.radians(arr[:n0, GYR]).mean(axis=0)

    u = acc[:n0].mean(axis=0)
    u = u / np.linalg.norm(u)
    if u[2] < -0.999:
        w, x, y, z = 0.0, 1.0, 0.0, 0.0
    else:
        w, x, y, z = 1.0 + u[2], u[1], -u[0], 0.0
    nq = np.sqrt(w * w + x * x + y * y + z * z)
    w, x, y, z = w / nq, x / nq, y / nq, z / nq

    out = np.empty(len(t))
    for i in range(len(t)):
        ax, ay, az = acc[i]
        if i > 0:
            dt = min(max(t[i] - t[i - 1], 0.0), 0.05)
            wx, wy, wz = gyr[i]
            an = np.sqrt(ax * ax + ay * ay + az * az)
            if an > 1e-6 and abs(an - 1.0) < GATE:
                kp = KP_GYRO * (1.0 - abs(an - 1.0) / GATE)
                vx = 2 * (x * z - w * y)
                vy = 2 * (y * z + w * x)
                vz = w * w - x * x - y * y + z * z
                nax, nay, naz = ax / an, ay / an, az / an
                wx += kp * (nay * vz - naz * vy)
                wy += kp * (naz * vx - nax * vz)
                wz += kp * (nax * vy - nay * vx)
            h = 0.5 * dt
            dw = -x * wx - y * wy - z * wz
            dx = w * wx + y * wz - z * wy
            dy = w * wy - x * wz + z * wx
            dz = w * wz + x * wy - y * wx
            w, x, y, z = w + dw * h, x + dx * h, y + dy * h, z + dz * h
            nq = np.sqrt(w * w + x * x + y * y + z * z)
            w, x, y, z = w / nq, x / nq, y / nq, z / nq
        out[i] = (2 * (x * z - w * y) * ax + 2 * (y * z + w * x) * ay
                  + (w * w - x * x - y * y + z * z) * az)
    return out


def auswerten(samples, masse, modus, grenzfreq=20.0, hz=None, fenster=None):
    """
    samples   : Liste/Array (t, ax, ay, az, az_welt[, gx, gy, gz])
    masse     : bewegte Gesamtmasse in kg
    modus     : 0 = nur Z-Achse, 1 = Sensorwinkel, 2 = Gyro-Filter
    grenzfreq : Tiefpass-Grenzfrequenz in Hz (None = aus)
    hz        : eingestellte Abtastrate (None = aus den Daten schätzen)
    fenster   : optionale feste Wiederholungsfenster [(t0, t1), ...] in Sekunden
    """
    arr = np.array(samples, dtype=float)
    if arr.ndim != 2 or len(arr) < 50 or arr.shape[1] < 4:
        raise ValueError("Zu wenige oder ungültige Messdaten.")
    warn = []

    if not HAS_SCIPY:
        warn.append("scipy ist nicht installiert - einfacherer Tiefpass, Ergebnisse weichen leicht ab. "
                    "Empfohlen: pip install scipy")

    n_sat = int(np.sum(np.any(np.abs(arr[:, ACC]) >= SAT_G, axis=1)))
    if n_sat:
        warn.append(f"Sensor übersteuert ({n_sat} Samples ≥ {SAT_G} g) - Spitzenwerte unzuverlässig!")

    arr[:, COL_T] = rekonstruiere_zeit(arr[:, COL_T])
    t = arr[:, COL_T]
    if t[-1] <= 0:
        raise ValueError("Ungültige Zeitachse.")

    hz_mess = (len(t) - 1) / t[-1]
    if hz is None:
        hz = min(RATE_STUFEN, key=lambda r: abs(r - hz_mess))
    if abs(hz_mess / hz - 1) > RATE_TOL:
        nah = min(RATE_STUFEN, key=lambda r: abs(r - hz_mess))
        if abs(hz_mess / nah - 1) <= RATE_TOL:
            # Der Sensor sendet gleichmäßig eine andere Stufe als eingestellt (z. B. nur 100 statt 200 Hz über
            # Bluetooth). Das ist kein Paketverlust, die Auswertung rechnet mit der tatsächlichen Rate.
            warn.append(f"Gemessene Rate {nah} Hz statt der eingestellten {hz} Hz: es kommen nicht mehr an (Sensor oder Bluetooth). "
                        f"Ausgewertet wird mit {nah} Hz.")
            hz = nah
        else:
            warn.append(f"Gemessene Rate {hz_mess:.0f} Hz weicht von {hz} Hz ab - Paketverlust? "
                        "Zeitachse evtl. verzerrt.")
    dt = 1.0 / hz

    if modus == 0:
        acc_g = arr[:, COL_AZ]
    elif modus == 2 and arr.shape[1] >= 8:
        acc_g = vertikal_mit_gyro(arr)
    elif arr.shape[1] > COL_AZ_WELT:
        acc_g = arr[:, COL_AZ_WELT]
    else:
        acc_g = arr[:, COL_AZ]

    tu = np.arange(0, t[-1], dt)
    n = len(tu)
    a_g = np.interp(tu, t, acc_g)

    n0 = max(5, int(0.5 / dt))
    a_raw = (a_g - np.mean(a_g[:n0])) * G
    if np.std(a_raw[:n0]) > RUHE_STD_MAX:
        warn.append("Sensor war in den ersten 0,5 s nicht ruhig - Nullpunkt evtl. verfälscht.")
    a = tiefpass(a_raw, hz, grenzfreq)

    v_roh = integrieren(a, dt)

    schwelle = max(0.4, 6 * np.std(a[:n0]))
    aktiv = np.abs(a) > schwelle
    if aktiv.sum() >= 3:
        pad = int(0.15 / dt)
        i0 = max(int(np.argmax(aktiv)) - pad, 0)
        i1 = min(n - 1 - int(np.argmax(aktiv[::-1])) + pad, n - 1)
    else:
        i0, i1 = 0, n - 1
    idx = np.arange(n)
    im_fenster = (idx >= i0) & (idx <= i1)

    def v_aus_ankern(anker):
        v_ = v_roh - np.interp(idx, anker, v_roh[anker])
        v_[~im_fenster] = 0.0
        return v_

    # Drift herausrechnen: Anker an den Starts aller Kandidaten (dort ist v ~ 0), mehrfach wiederholen,
    # weil bessere Anker die Kandidaten wieder verbessern (wichtig bei langen Sätzen mit Sensorkippen).
    v = v_aus_ankern([i0, i1])
    for v_min in ANKER_SCHWELLEN:
        kand = erkenne(v, dt, v_min)
        anker = sorted(set([i0] + [min(max(s - 1, i0), i1) for s, _ in kand] + [i1]))
        v = v_aus_ankern(anker)
    segs = verwerfe_stoerungen(v, erkenne(v, dt, V_MIN_KAND, V_HOCH_KAND), dt)

    if fenster is not None:
        grenzen = [(int(round(t0 / dt)), int(round(t1 / dt))) for t0, t1 in fenster]
    else:
        grenzen = list(segs)
    v = zyklen_schliessen(v, [g[0] for g in grenzen], dt, ende=i1)

    F = masse * (a + G)
    P = F * v
    weg = integrieren(v, dt)

    res = Ergebnis(t=tu, weg=weg, v=v, a=a, F=F, P=P, dt=dt, hz=int(hz),
                   drift=float(abs(v_roh[i1] - v_roh[i0])), warnungen=warn)
    res.setze_reps(grenzen)
    return res

let py = null;
const BOOT = `
import json, numpy as np, analyse as A
from dataclasses import asdict
RES = None
def _R(x): return np.round(np.asarray(x, float), 5).tolist()
def pack(r):
    return json.dumps(dict(t=_R(r.t), weg=_R(r.weg), hub=_R(r.hub), v=_R(r.v), a=_R(r.a), F=_R(r.F), P=_R(r.P),
        dt=float(r.dt), hz=int(r.hz), drift=float(r.drift), warn=list(r.warnungen),
        reps=[asdict(p) for p in r.reps], scipy=bool(A.HAS_SCIPY), vmin=A.V_MIN_REP, minf=A.MIN_FENSTER_SAMPLES))
def run_eval(par, buf):
    global RES
    p = json.loads(par)
    arr = np.array(buf.to_py(), dtype=float).reshape(-1, p["ncols"])
    RES = A.auswerten(arr, p["masse"], p["modus"], p["grenz"], p["hz"], p["fenster"])
    return pack(RES)
def run_setze(par):
    RES.setze_reps([tuple(x) for x in json.loads(par)])
    return pack(RES)
def run_bereich(par):
    t0, t1 = json.loads(par)
    return json.dumps([list(map(int, x)) for x in RES.erkenne_im_bereich(t0, t1)])
`;
self.onmessage = async (e) => {
  const { id, cmd, args } = e.data;
  try {
    let out = null;
    if (cmd === "init") {
      importScripts(args.base + "pyodide.js");
      py = await loadPyodide({ indexURL: args.base });
      let scipyOk = true;
      try { await py.loadPackage(["numpy", "scipy"]); }
      catch (err) { scipyOk = false; await py.loadPackage(["numpy"]); }
      py.FS.writeFile("analyse.py", args.src);
      py.runPython(BOOT);
      out = { scipyOk };
    } else if (cmd === "eval") {
      py.globals.set("PAR", JSON.stringify(args.par));
      py.globals.set("BUF", args.buf);
      out = py.runPython("run_eval(PAR, BUF)");
    } else if (cmd === "setze") {
      py.globals.set("PAR", JSON.stringify(args.grenzen));
      out = py.runPython("run_setze(PAR)");
    } else if (cmd === "bereich") {
      py.globals.set("PAR", JSON.stringify(args.bereich));
      out = py.runPython("run_bereich(PAR)");
    }
    self.postMessage({ id, ok: true, out });
  } catch (err) {
    self.postMessage({ id, ok: false, err: String(err && err.message || err) });
  }
};

<script>"use strict";
/* Bluetooth-Anbindung (Web Bluetooth) und Live-Berechnung für den WitMotion WT9011DCL.
   Entspricht der Klasse Sensor im PC-Programm (explosivkraft.py). */

const G = 9.80665;
const SERVICE_UUIDS = ["0000ffe5-0000-1000-8000-00805f9a34fb", "0000ffe0-0000-1000-8000-00805f9a34fb"];
const NOTIFY_UUID = "0000ffe4-0000-1000-8000-00805f9a34fb";
const WRITE_UUID = "0000ffe9-0000-1000-8000-00805f9a34fb";
// WT9011DCL laut Datenblatt: 0x0A ist nicht belegt, 200 Hz = 0x0B
const RATE_CODES = { 10: 0x06, 20: 0x07, 50: 0x08, 100: 0x09, 200: 0x0B };

const STILL_STD = 0.25, POS_RESET = 0.15, RUHE_STRENG = 0.06, RUHE_LOCKER_S = 1.0, V_RUHE = 0.08;
const VERTRAUEN_MIN = 0.4, ABW_WEIT = 1.0, BIAS_RATE = 0.01, RUHE_MAX_S = 2.5;
const LIVE_MAX = 3000;

function mittel(a) { let s = 0; for (const x of a) s += x; return s / a.length; }
function stdabw(a) { const m = mittel(a); let s = 0; for (const x of a) s += (x - m) * (x - m); return Math.sqrt(s / a.length); }
function integrieren(a, dt) {           // Trapezregel wie analyse.integrieren
  const out = new Array(a.length); out[0] = 0;
  for (let i = 1; i < a.length; i++) out[i] = out[i - 1] + (a[i] + a[i - 1]) / 2 * dt;
  return out;
}

class Sensor {
  constructor(onEvent) {
    this.onEvent = onEvent || (() => {});
    this.device = null; this.server = null; this.notifyChar = null; this.writeChar = null;
    this.buf = []; this.t0 = performance.now() / 1000;
    this.mass = 100; this.scale = 1.0; this.calib = null; this.hz = 100;
    this.recording = false; this.rec = [];
    this.live = [];                 // Zeilen: [t, pos, v, a, F, P]
    this.frames = 0;
    this.resetLive();
  }

  resetLive() {
    this.win = []; this.winMax = 25; this.bias = 0; this.vLive = 0; this.posLive = 0;
    this.nSamples = 0; this.tFirst = null; this.tLive = 0; this.dtNom = 0.01; this.biasOk = false;
    this.stillN = 0; this.quietN = 0; this.calmN = 0; this.pfad = 0;
    this.segAktiv = false; this.segA = []; this.biasStart = 0; this.restPos = 0;
    this.live = [];
  }

  get connected() { return !!(this.server && this.server.connected); }

  // ---------- Verbindung ----------
  async connect(alleGeraete = false) {
    const opts = alleGeraete
      ? { acceptAllDevices: true, optionalServices: SERVICE_UUIDS }
      : { filters: [{ namePrefix: "WT" }], optionalServices: SERVICE_UUIDS };
    this.onEvent("status", "Suche Sensor ...");
    this.device = await navigator.bluetooth.requestDevice(opts);
    this.device.addEventListener("gattserverdisconnected", () => this.onEvent("disconnected", "Verbindung zum Sensor verloren."));
    this.onEvent("status", `Verbinde mit ${this.device.name || "Sensor"} ...`);
    this.server = await this.device.gatt.connect();
    this.notifyChar = null; this.writeChar = null;
    for (const uuid of SERVICE_UUIDS) {
      let svc;
      try { svc = await this.server.getPrimaryService(uuid); } catch (e) { continue; }
      for (const ch of await svc.getCharacteristics()) {
        if (ch.uuid === NOTIFY_UUID) this.notifyChar = ch;
        if (ch.uuid === WRITE_UUID) this.writeChar = ch;
      }
      if (this.notifyChar) break;
    }
    if (!this.notifyChar) throw new Error("Datenkanal des Sensors nicht gefunden (Service FFE5/FFE4).");
    this.buf = [];
    this.resetLive();
    this.notifyChar.addEventListener("characteristicvaluechanged", (e) => this.onData(e.target.value));
    await this.notifyChar.startNotifications();
    try { await this.applyRate(100); } catch (e) { console.warn("Standard-Abtastrate konnte nicht gesetzt werden", e); }
    this.onEvent("connected", this.device.name || "Sensor");
  }

  disconnect() {
    try { if (this.server && this.server.connected) this.server.disconnect(); } catch (e) { /* ignorieren */ }
  }

  async write(bytes) {
    if (!this.writeChar) throw new Error("Schreibkanal des Sensors nicht gefunden.");
    const u8 = new Uint8Array(bytes);
    if (this.writeChar.writeValueWithoutResponse) await this.writeChar.writeValueWithoutResponse(u8);
    else await this.writeChar.writeValue(u8);
  }

  async applyRate(hz) {
    await this.write([0xFF, 0xAA, 0x69, 0x88, 0xB5]);          // entsperren
    await new Promise(r => setTimeout(r, 200));
    await this.write([0xFF, 0xAA, 0x03, RATE_CODES[hz], 0x00]);
    this.winMax = Math.max(5, Math.floor(hz * 0.25));
    this.dtNom = 1.0 / hz; this.nSamples = 0; this.tFirst = null; this.win = [];
    this.hz = hz;
  }

  // ---------- Datenempfang ----------
  onData(dataView) {
    for (let i = 0; i < dataView.byteLength; i++) this.buf.push(dataView.getUint8(i));
    const tAnkunft = performance.now() / 1000 - this.t0;
    while (this.buf.length >= 20) {
      if (this.buf[0] !== 0x55 || this.buf[1] !== 0x61) { this.buf.shift(); continue; }
      const f = this.buf.splice(0, 20);
      const dv = new DataView(new Uint8Array(f).buffer);
      const v = []; for (let k = 0; k < 9; k++) v.push(dv.getInt16(2 + 2 * k, true));
      this.verarbeite(v, tAnkunft);
    }
  }

  verarbeite(v, t) {
    let ax = v[0] / 32768 * 16, ay = v[1] / 32768 * 16, az = v[2] / 32768 * 16;
    if (this.calib) this.calib.push([ax, ay, az]);
    ax *= this.scale; ay *= this.scale; az *= this.scale;
    const gx = v[3] / 32768 * 2000, gy = v[4] / 32768 * 2000, gz = v[5] / 32768 * 2000;
    const roll = v[6] / 32768 * Math.PI, pitch = v[7] / 32768 * Math.PI;
    const azW = -Math.sin(pitch) * ax + Math.sin(roll) * Math.cos(pitch) * ay + Math.cos(roll) * Math.cos(pitch) * az;
    this.frames++;
    this.liveUpdate(t, (azW - 1.0) * G);
    if (this.recording) this.rec.push([t, ax, ay, az, azW, gx, gy, gz]);
  }

  // ---------- Live-Berechnung (1:1 aus dem PC-Programm) ----------
  liveUpdate(tAnkunft, aRaw) {
    this.nSamples++;
    if (this.tFirst === null) this.tFirst = tAnkunft;
    else if (this.nSamples >= 300 && this.nSamples % 100 === 0) {
      const dtMittel = (tAnkunft - this.tFirst) / (this.nSamples - 1);
      if (Math.abs(dtMittel - this.dtNom) > 0.25 * this.dtNom) this.dtNom = dtMittel;
    }
    this.tLive += this.dtNom;
    const dtStep = this.dtNom;

    this.win.push(aRaw); if (this.win.length > this.winMax) this.win.shift();
    let ruhig = false;
    if (this.win.length === this.winMax) {
      const w = this.win;
      const tol = this.biasOk ? 0.3 : 1.5;
      const mw = mittel(w);

  m.hidden = false; const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, cr.left + x - w / 2)) + "px";
  m.style.top = Math.max(6, Math.min(window.innerHeight - h - 6, cr.top + y - h - 12)) + "px";
}
function schliesseMenu() { $("menu").hidden = true; }
function loeschAus() { plot.deleteMode = false; $("btnDel").classList.remove("on"); }
function loeschToggle() {
  const an = !plot.deleteMode; if (an) { boxAus(); kanteAus(); } plot.deleteMode = an; $("btnDel").classList.toggle("on", an);
  status(an ? "Löschen: auf das orange Fenster der falschen Wiederholung tippen. „Rückgängig“ holt sie zurück." : "Löschen ist aus.");
}
function kanteAus() { plot.editEdges = false; $("btnEdge").classList.remove("on"); }
function kanteToggle() {
  const an = !plot.editEdges; if (an) { boxAus(); loeschAus(); } plot.editEdges = an; $("btnEdge").classList.toggle("on", an);
  status(an ? "Fenster verschieben: Kante eines orangen Fensters ziehen. Zum Beenden den Knopf noch einmal tippen." : "Fenster verschieben ist aus.");
}
function boxAus() { S.box = false; plot.boxMode = false; plot.box = null; $("btnBox").classList.remove("on"); $("plot").style.cursor = ""; plot.draw(); }
function boxToggle() {
  S.box = !S.box; if (S.box) { kanteAus(); loeschAus(); } plot.boxMode = S.box; $("btnBox").classList.toggle("on", S.box);
  if (S.box) status("Bereich markieren: mit dem Finger ein Stück der Zeitachse markieren (Verschieben ist dabei ausgeschaltet).");
  else boxAus();
}
async function boxAktion(art, t0, t1) {
  const res = S.res; if (!res) return;
  const n = res.t.length, i0 = Math.max(0, Math.round(t0 / res.dt)), i1 = Math.min(n, Math.round(t1 / res.dt));
  let neu;
  if (art === "erkennen") {
    try { neu = JSON.parse(await call("bereich", { bereich: [t0, t1] })); } catch (e) { status("Fehler: " + e.message); return; }
    if (!neu.length) { status("Im markierten Bereich wurde keine Wiederholung erkannt, auch nicht mit empfindlicher Schwelle. Mit „Bereich als eine Wiederholung hinzufügen“ geht es von Hand."); return; }
  } else {
    if (i1 - i0 < res.minf) { status("Der markierte Bereich ist zu klein."); return; }
    neu = [[i0, i1]];
  }
  const behalten = res.reps.filter(r => !(neu.some(([s, e]) => r.s < e && s < r.e) || (art === "erkennen" && i0 <= (r.s + r.e) / 2 && (r.s + r.e) / 2 < i1))).map(r => [r.s, r.e]);
  const ersetzt = res.reps.length - behalten.length;
  await uebernehmeGrenzen(behalten.concat(neu));
  boxAus();
  status((art === "erkennen" ? `${neu.length} Wiederholung(en) im Bereich erkannt` : "Wiederholung hinzugefügt") + (ersetzt ? `, ${ersetzt} bestehende ersetzt` : "") + `. Jetzt ${S.res.reps.length} Wiederholungen. Rückgängig ist möglich.`);
}
function plotEdit(typ, d) {
  if (typ === "status") status(d);
  else if (typ === "delete") {
    const res = S.res; if (!res) return; const idx = Math.round(d.t / res.dt), k = res.reps.findIndex(r => r.s <= idx && idx < r.e);
    if (k < 0) { status("Dort ist kein Fenster. Auf ein oranges Fenster tippen."); return; }
    const nr = res.reps[k].nr; loeschAus(); repLoeschen(k).then(() => status(`Wiederholung ${nr} gelöscht. Jetzt ${S.res.reps.length} Wiederholungen. Rückgängig ist möglich.`));
  }
  else if (typ === "grenzen") uebernehmeGrenzen(d.grenzen).then(() => status("Zeitfenster manuell angepasst."));
  else if (typ === "long") {
    const res = S.res; if (!res) return; const idx = Math.round(d.t / res.dt), k = res.reps.findIndex(r => r.s <= idx && idx < r.e);
    if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) { /* ignorieren */ }
    if (k >= 0) zeigeMenu(d.x, d.y, [[`Wiederholung ${res.reps[k].nr} löschen`, () => repLoeschen(k)], ["Abbrechen"]]);
    else zeigeMenu(d.x, d.y, [["Wiederholung hier hinzufügen (1 s)", () => repHinzufuegen(Math.max(0, idx))], ["Abbrechen"]]);
  } else if (typ === "box") {
    zeigeMenu(d.x, d.y, [["Wiederholungen im Bereich automatisch erkennen", () => boxAktion("erkennen", d.t0, d.t1)], ["Bereich als eine Wiederholung hinzufügen", () => boxAktion("hinzufuegen", d.t0, d.t1)], ["Abbrechen"]]);
  }
}


// ---------- Letzte Messung sichern (übersteht versehentliches Neuladen) ----------
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("ek-db", 1); r.onupgradeneeded = () => r.result.createObjectStore("m"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function sichere() {
  try {
    if (!S.samples.length) return; const db = await idb(), res = S.res;
    const rec = { t: Date.now(), samples: S.samples, hz: S.samplesHz, masse: $("masse").value, korr: $("korr").value, filter: $("filter").value,
      fenster: res && S.manual ? res.reps.map(r => [r.s * res.dt, r.e * res.dt]) : null };
    db.transaction("m", "readwrite").objectStore("m").put(rec, "letzte");
  } catch (e) { /* ignorieren */ }
}
async function holeLetzte() { try { const db = await idb(); return await new Promise(r => { const q = db.transaction("m").objectStore("m").get("letzte"); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch (e) { return null; } }
async function loescheLetzte() { try { const db = await idb(); db.transaction("m", "readwrite").objectStore("m").delete("letzte"); } catch (e) { /* ignorieren */ } $("btnLast").disabled = true; }
async function stelleWiederHer(auto) {
  const r = await holeLetzte(); if (!r) { status("Keine gesicherte Messung vorhanden."); return; }
  S.samples = r.samples; S.samplesHz = r.hz; $("masse").value = r.masse; $("korr").value = r.korr; $("filter").value = r.filter;
  zeigeTab("curves"); await auswerten(auto ? " - letzte Messung automatisch wiederhergestellt" : " - letzte Messung geladen", r.fenster);
}
async function startWiederherstellung() {
  const r = await holeLetzte(); $("btnLast").disabled = !r;
  if (r && Date.now() - r.t < 20 * 60 * 1000 && !S.samples.length && S.state === "idle") stelleWiederHer(true);
}

// ---------- Oberfläche ----------
function zeigeTab(name) {
  $("tab-curves").hidden = name !== "curves"; $("tab-reps").hidden = name !== "reps";
  $("tbCurves").classList.toggle("on", name === "curves"); $("tbReps").classList.toggle("on", name === "reps");
  if (name === "curves") plot.resize(); else zeichneBalken();
}
function init() {
  lade(); plot = new Plot($("plot"), cursorAnzeige); plot.onEdit = plotEdit;
  $("btnLast").onclick = () => stelleWiederHer(false); $("btnUndo").onclick = rueckgaengig; $("btnBox").onclick = boxToggle; $("btnEdge").onclick = kanteToggle; $("btnDel").onclick = loeschToggle;
  document.addEventListener("pointerdown", e => { if (!$("menu").hidden && !$("menu").contains(e.target)) schliesseMenu(); }, true);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {}); plot.setEmpty(); cursorAnzeige();
  $("btnConnect").onclick = verbinden; $("btnCal").onclick = kalibrieren; $("btnLive").onclick = toggleLive;
  $("btnStart").onclick = start; $("btnStop").onclick = stopManuell;
  $("btnSave").onclick = speichern; $("btnExport").onclick = exportTabelle; $("btnReeval").onclick = neuAuswerten; $("btnReset").onclick = zuruecksetzen;
  $("btnLoad").onclick = () => $("file").click(); $("file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) laden(f); };
  $("btnZoom").onclick = () => plot.resetZoom();
  $("zahlen").onchange = e => { plot.zahlenAus = e.target.checked; plot.draw(); };
  $("tbCurves").onclick = () => zeigeTab("curves"); $("tbReps").onclick = () => zeigeTab("reps");
  $("rate").onchange = async () => { if (S.sensor && S.sensor.connected) { const hz = parseInt($("rate").value, 10); status(`Stelle Abtastrate auf ${hz} Hz ...`); try { await S.sensor.applyRate(hz); status(`Abtastrate: ${hz} Hz`); } catch (e) { status("Abtastrate konnte nicht gesetzt werden: " + e.message); } } };
  $("masseHelp").onclick = () => alert("Für Kraft und Leistung zählt die gesamte bewegte Masse.\n\nBeispiel Kniebeuge/Bankdrücken: Hantel + anteiliges Körpergewicht (bei der Kniebeuge grob 80-90 % des Körpergewichts).\nBei Sprüngen: Körpergewicht (+ Zusatzlast).");
  for (const id of ["masse", "dauer", "korr", "filter"]) $(id).onchange = speichere;
  window.addEventListener("resize", zeichneBalken);
  setVerbunden(false); aktualisiereKnoepfe();
  if (!navigator.bluetooth) { status("Hinweis: Dieser Browser unterstützt kein Bluetooth (Chrome auf Android verwenden). Laden und Auswerten von Dateien geht trotzdem."); $("btnConnect").disabled = true; }
  startWorker(); liveTick(); startWiederherstellung();
  window.addEventListener("beforeunload", e => { if (S.state === "countdown" || S.state === "recording") { e.preventDefault(); e.returnValue = ""; } });
}
window.addEventListener("DOMContentLoaded", init);
</script>
